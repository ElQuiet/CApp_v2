<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar foto</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #1C2522; --muted: #66726D; --rule: #DCE2DF; --accent: #0F6E7C; --surface: #FFFFFF;
          --good: #3F8F5A; --warn: #C08A2E; --err: #A33A2C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font-family: "IBM Plex Sans", system-ui, sans-serif; }
  #row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scroll-behavior: smooth;
         scrollbar-width: thin; outline: none; }
  #row:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 8px; }
  .t { flex: 0 0 auto; width: 112px; border: 1.5px solid var(--rule); border-radius: 8px; padding: 0;
       background: var(--surface); cursor: pointer; text-align: left; overflow: hidden; font: inherit;
       transition: border-color .12s, transform .12s, box-shadow .12s; }
  .t:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.18); }
  .t:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .t.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .t img { display: block; width: 100%; height: 64px; object-fit: cover; background: #0d1210; }
  .m { display: flex; align-items: center; gap: 6px; padding: 5px 7px 6px; }
  .d { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: var(--rule); }
  .d.good { background: var(--good); } .d.warn { background: var(--warn); } .d.err { background: var(--err); }
  .tx { min-width: 0; }
  .l { font-size: .74rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .s { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) { .t { transition: none; } .t:hover { transform: none; } #row { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="row" tabindex="0" role="listbox" aria-label="Daftar foto. Gunakan panah kiri dan kanan untuk berpindah."></div>
<script>
function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*"); }
const row = document.getElementById("row");
let items = [], sel = null, sig = "";

function pick(id) {
  if (!id || id === sel) return;
  sel = id; mark();
  send("streamlit:setComponentValue", { value: { id, nonce: Date.now() + Math.random() }, dataType: "json" });
}
function mark() {
  for (const el of row.children) {
    const on = el.dataset.id === sel;
    el.classList.toggle("sel", on); el.setAttribute("aria-selected", on);
    if (on) el.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}
function render() {
  row.innerHTML = "";
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "t"; b.dataset.id = it.id; b.setAttribute("role", "option");
    b.title = it.title || it.label;
    b.innerHTML = `<img alt="" src="${it.src}" width="112" height="64" decoding="async"><div class="m"><span class="d ${it.tone || ""}"></span>` +
      `<div class="tx"><div class="l"></div><div class="s"></div></div></div>`;
    b.querySelector(".l").textContent = it.label;
    b.querySelector(".s").textContent = it.sub || "";
    b.onclick = () => pick(it.id);
    row.appendChild(b);
  }
  mark();
}
row.addEventListener("keydown", (e) => {
  const i = items.findIndex((x) => x.id === sel);
  if (e.key === "ArrowRight" && i < items.length - 1) { pick(items[i + 1].id); e.preventDefault(); }
  if (e.key === "ArrowLeft" && i > 0) { pick(items[i - 1].id); e.preventDefault(); }
});
window.addEventListener("message", (ev) => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  const a = ev.data.args, r = document.documentElement.style;
  for (const k of ["ink", "muted", "rule", "accent", "surface", "good", "warn", "err"]) if (a.theme && a.theme[k]) r.setProperty("--" + k, a.theme[k]);
  const s = JSON.stringify(a.items.map((x) => [x.id, x.label, x.sub, x.tone, x.src.length]));
  items = a.items; sel = a.selected;
  if (s !== sig) { sig = s; render(); } else mark();
  send("streamlit:setFrameHeight", { height: 118 });
});
send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
